name: refresh-data

# 매월 1일 05:00 ICT (= 22:00 UTC 전날)
on:
  schedule:
    - cron: "0 22 28-31 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 말일 트리거 중 '다음날이 1일'인 회차만 실행 (cron으로는 월말을 못 잡는다).
      # exit 0으로는 뒤 스텝이 멈추지 않는다 — 출력으로 넘겨 각 스텝에 조건을 건다.
      - name: Gate to month-end
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # cron은 22:00 UTC에 발화하고 ICT는 UTC+7이므로, 그 순간의 현지 시각은
          # 이미 '다음 날 05:00 ICT'다. 따라서 확인할 것은 "내일"이 아니라
          # **지금의 ICT 날짜**다.
          #   · `tomorrow +7 hours`(하루 더)로 보면 매달 하루 일찍 돌고,
          #     28일뿐인 2월은 cron 범위(28-31)와 어긋나 **한 해에 한 번도 안 돈다**.
          #   · `+7 hours`면 말일 22:00 UTC = 1일 05:00 ICT에 정확히 12회/년 돈다.
          ict_day=$(date -u -d "+7 hours" +%d)
          if [ "$ict_day" = "01" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ICT 기준 1일이 아님 (현재 ICT 일자: ${ict_day}) — 이번 회차는 건너뛴다."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.run == 'true'
        run: pip install -r etl/requirements.txt

      # OG 이미지의 한글 문구용. 없으면 og_image.py가 영문 문구로 내려간다
      # (두부 글자를 내지는 않지만, 배포되는 미리보기는 한글이어야 한다).
      # NESDC 워크북 캐시. 연 1회 공표물이라 실행 간에 이어 두면
      # 그쪽 서버가 502를 내는 달에도 갱신이 멈추지 않는다.
      # data/raw/는 gitignore이므로 저장소에 재배포되지 않는다.
      - name: Cache NESDC workbook
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw/nesdc-gpp-*.xlsx
          key: nesdc-gpp-${{ github.run_id }}
          restore-keys: nesdc-gpp-

      - name: Install Korean font
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      # 파서 회귀 테스트가 먼저다. 픽스처조차 못 읽는 상태로 원본을 긁을 이유가 없다.
      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest tests/ -q

      - name: Run ETL
        if: steps.gate.outputs.run == 'true'
        working-directory: etl
        run: python build.py

      # validate.py 게이트를 통과하지 못하면 위에서 실패하고 PR이 열리지 않는다.
      - name: Open PR if data changed
        if: steps.gate.outputs.run == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/auto-refresh
          title: "data: 월간 갱신"
          commit-message: "data: refresh from upstream sources"
          body: |
            ETL 자동 실행 결과입니다. **머지 전에 diff를 확인하세요.**

            BOT 통계 페이지는 ASP.NET 렌더라 구조가 바뀌면 파서가 조용히 깨집니다.
            아래를 눈으로 확인해 주세요:

            - [ ] 77개 주가 전부 있는가
            - [ ] 지점수가 0이 된 주가 없는가
            - [ ] 예금·여신 자릿수가 이상하지 않은가
            - [ ] `meta.json`의 `as_of`가 실제로 전진했는가
            - [ ] `meta.json`의 `degraded_sources`에 새로 추가된 소스가 없는가
                  (있다면 해당 지표가 조용히 결측이 된 것이다)
            - [ ] `meta.json`의 `fingerprint.header_hash`가 지난달과 같은가
            - [ ] `public/og.png` 미리보기가 지도처럼 보이는가 (한글이 두부로 깨지지 않았는가)
            - [ ] `meta.json`에 `from_cache` / `from_snapshot`이 붙은 소스가 없는가
                  (있으면 그 소스는 이번에 새로 받은 것이 아니다)
          labels: data
          add-paths: |
            data/processed
            data/reference
            public/og.png
