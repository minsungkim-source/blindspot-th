name: refresh-data

# 매월 ICT 1~3일 05:00에 시도하고, 그달 처음 성공한 한 번만 PR을 연다.
# 판단은 .github/scripts/refresh_gate.py — 이유와 규칙은 그 파일 머리말,
# 1년치 시뮬레이션은 tests/test_refresh_gate.py.
on:
  schedule:
    # 말일 22:00 UTC = ICT 1일 05:00 / 1일 → ICT 2일 / 2일 → ICT 3일.
    # 1·2일을 더한 이유: 예약 실행은 늦거나 빠질 수 있는데, 예전엔 한 달에 기회가 한 번이었다.
    - cron: "0 22 1,2,28-31 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 이번 회차에 돌릴지 정한다. exit 0으로는 뒤 스텝이 멈추지 않으므로
      # 출력(run=true/false)으로 넘기고 각 스텝에 조건을 건다.
      # ubuntu-latest에 python3·gh가 기본으로 있다 (setup-python보다 먼저 돈다).
      - name: Gate — ICT 1~3일, 이번 달 첫 갱신만
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/refresh_gate.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.run == 'true'
        run: pip install -r etl/requirements.txt

      # OG 이미지의 한글 문구용. 없으면 og_image.py가 영문 문구로 내려간다
      # (두부 글자를 내지는 않지만, 배포되는 미리보기는 한글이어야 한다).
      # NESDC 워크북 캐시. 연 1회 공표물이라 실행 간에 이어 두면
      # 그쪽 서버가 502를 내는 달에도 갱신이 멈추지 않는다.
      # data/raw/는 gitignore이므로 저장소에 재배포되지 않는다.
      - name: Cache NESDC workbook
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw/nesdc-gpp-*.xlsx
          key: nesdc-gpp-${{ github.run_id }}
          restore-keys: nesdc-gpp-

      - name: Install Korean font
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      # 파서 회귀 테스트가 먼저다. 픽스처조차 못 읽는 상태로 원본을 긁을 이유가 없다.
      - name: Test
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest tests/ -q

      - name: Run ETL
        if: steps.gate.outputs.run == 'true'
        working-directory: etl
        run: python build.py

      # 지난달 산출물(HEAD)과 비교해 검토 요약을 만든다 — PR 본문이 된다.
      # 기계가 비교할 수 있는 건 기계가 비교하고, 사람은 판정만 본다.
      # Actions 실행 화면(Step summary)에도 같은 내용이 남는다.
      - name: Summarize for review
        if: steps.gate.outputs.run == 'true'
        run: python .github/scripts/refresh_summary.py "$RUNNER_TEMP/pr-body.md"

      # validate.py 게이트를 통과하지 못하면 위에서 실패하고 PR이 열리지 않는다.
      - name: Open PR if data changed
        if: steps.gate.outputs.run == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/auto-refresh
          title: "data: 월간 갱신"
          commit-message: "data: refresh from upstream sources"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: data
          add-paths: |
            data/processed
            data/reference
            public/og.png
